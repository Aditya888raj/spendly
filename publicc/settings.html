<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - Spendly</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Spendly</div>
    <div class="nav-links">
      <span class="greeting" id="greeting"></span>
      <a href="dashboard.html">Dashboard</a>
      <a href="expenses.html">Expenses</a>
      <a href="settings.html" class="active">Settings</a>
      <button id="logoutBtn" class="btn btn-small btn-outline">Logout</button>
    </div>
  </nav>

  <main class="container">
    <h1 class="page-title">Settings</h1>

    <div class="settings-grid">
      <!-- Profile -->
      <section class="card">
        <h2>Profile</h2>
        <div id="profileMsg" class="form-msg"></div>
        <form id="profileForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" readonly />
          </div>
          <button type="submit" class="btn btn-auto">Save changes</button>
        </form>
      </section>

      <!-- Password -->
      <section class="card">
        <h2>Change password</h2>
        <div id="passwordMsg" class="form-msg"></div>
        <form id="passwordForm">
          <div class="form-group">
            <label for="currentPassword">Current password</label>
            <input type="password" id="currentPassword" required />
          </div>
          <div class="form-group">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" placeholder="At least 6 characters" required />
          </div>
          <div class="form-group">
            <label for="confirmNewPassword">Confirm new password</label>
            <input type="password" id="confirmNewPassword" required />
          </div>
          <button type="submit" class="btn btn-auto">Update password</button>
        </form>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
