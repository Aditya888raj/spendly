<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses - Spendly</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Spendly</div>
    <div class="nav-links">
      <span class="greeting" id="greeting"></span>
      <a href="dashboard.html">Dashboard</a>
      <a href="expenses.html" class="active">Expenses</a>
      <a href="settings.html">Settings</a>
      <button id="logoutBtn" class="btn btn-small btn-outline">Logout</button>
    </div>
  </nav>

  <main class="container">
    <h1 class="page-title">Expenses</h1>

    <!-- Search, filters, sort, add -->
    <div class="toolbar">
      <div class="form-group search-group">
        <label for="searchInput">Search</label>
        <input type="text" id="searchInput" placeholder="Search by title..." />
      </div>

      <div class="form-group">
        <label for="filterCategory">Category</label>
        <select id="filterCategory">
          <option value="">All</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="filterMonth">Month</label>
        <input type="month" id="filterMonth" />
      </div>

      <div class="form-group">
        <label for="sortBy">Sort by</label>
        <select id="sortBy">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="high">Amount: high to low</option>
          <option value="low">Amount: low to high</option>
          <option value="title">Title: A to Z</option>
        </select>
      </div>

      <button id="clearFilters" class="btn btn-small btn-outline">Clear</button>
      <button id="addBtn" class="btn btn-auto">+ Add expense</button>
    </div>

    <section class="card">
      <p class="total-line" id="totalLine"></p>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expenseBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Add / Edit modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add expense</h2>
        <button class="close-btn" id="closeModal" type="button">&times;</button>
      </div>

      <div id="errorMsg" class="error-msg"></div>

      <form id="expenseForm">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. Lunch" required />
        </div>

        <div class="form-group">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" min="1" step="0.01" placeholder="0" required />
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Entertainment</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/expenses.js"></script>
</body>
</html>
